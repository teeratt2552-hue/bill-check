<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ใบวางบิล - ร้านเฮียต้อม ยางพารา</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#fcd34d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ใบวางบิล">
<link rel="icon" href="icon.jpg" type="image/jpeg">
<link rel="apple-touch-icon" href="icon.jpg">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
<style>
  :root{
    --bg:#f6f7fb;
    --surface:#ffffff;
    --text:#1f2937;
    --muted:#6b7280;
    --line:#e5e7eb;
    --line-strong:#d1d5db;
    --primary:#2563eb;
    --primary-soft:#eff4ff;
    --primary-strong:#1d4ed8;
    --danger:#ef4444;
    --danger-soft:#fef2f2;
    --header:#fcd34d;
    --header-text:#78350f;
    --sum:#fff7c2;
    --sum-text:#854d0e;
    --total:#cffafe;
    --total-text:#155e75;
    --total2:#0e7490;
    --shadow:0 1px 2px rgba(15,23,42,.04), 0 8px 24px rgba(15,23,42,.04);
    --radius:14px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    font-family:"Sarabun","Segoe UI",Tahoma,sans-serif;
    margin:0;padding:32px 20px 56px;background:var(--bg);color:var(--text);
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1080px;margin:0 auto;display:grid;gap:18px}
  header.page{
    display:flex;align-items:center;justify-content:center;margin-bottom:6px;
  }
  header.page h1{
    margin:0;font-size:30px;font-weight:700;letter-spacing:1px;
    text-align:center;
  }
  .brand{
    font-size:17px;font-weight:700;color:var(--text);letter-spacing:.3px;
    margin:0 0 -4px 4px;
  }
  @media (max-width: 900px){ header.page h1{font-size:26px} }
  @media (max-width: 640px){ header.page h1{font-size:22px;letter-spacing:.5px} }

  .card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:18px 20px;
    box-shadow:var(--shadow);
  }
  .card h2{
    margin:0 0 12px;font-size:14px;font-weight:600;color:var(--muted);
    text-transform:uppercase;letter-spacing:.6px;
  }

  .row{display:flex;flex-wrap:wrap;gap:12px;align-items:end}
  .field{display:flex;flex-direction:column;gap:6px;min-width:0}
  .field.grow{flex:1;min-width:200px}
  label{font-size:13px;color:var(--muted);font-weight:500}

  input,select,button,textarea{
    font:inherit;color:var(--text);
    padding:10px 12px;border:1px solid var(--line-strong);
    border-radius:10px;background:#fff;
    transition:border-color .15s ease,box-shadow .15s ease,background .15s ease;
  }
  input::placeholder{color:#9ca3af}
  input:hover,select:hover{border-color:#9ca3af}
  input:focus,select:focus,textarea:focus{
    outline:none;border-color:var(--primary);
    box-shadow:0 0 0 4px rgba(37,99,235,.12);
  }

  button{
    cursor:pointer;background:var(--primary);color:#fff;
    border-color:var(--primary);font-weight:600;
    padding:10px 16px;
  }
  button:hover{background:var(--primary-strong);border-color:var(--primary-strong)}
  button.ghost{background:#fff;color:var(--text);border-color:var(--line-strong);font-weight:500}
  button.ghost:hover{background:#f9fafb;border-color:#9ca3af}
  button.danger{background:#fff;color:var(--danger);border-color:#fecaca;font-weight:500}
  button.danger:hover{background:var(--danger-soft);border-color:var(--danger)}
  button.icon{padding:8px 10px;font-size:13px}

  .filter-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
  .filter-bar .spacer{flex:1}

  .plate-input-wrap{position:relative;display:flex;gap:8px;align-items:stretch;min-width:240px}
  .plate-input-wrap input{flex:1}
  .plate-input-wrap button{padding:0 12px;font-size:13px}

  /* Table */
  .table-wrap{overflow-x:auto;border-radius:10px;border:1px solid var(--line)}
  table{border-collapse:separate;border-spacing:0;width:100%;background:#fff;font-size:14px}
  th,td{padding:10px 12px;text-align:center;border-bottom:1px solid var(--line)}
  th + th, td + td{border-left:1px solid var(--line)}
  thead th{
    background:var(--header);color:var(--header-text);
    font-weight:700;letter-spacing:.2px;
    border-bottom:1px solid #e0a82e;
  }
  tbody tr:hover td{background:#fafbff}
  tr.sum td{background:var(--sum);color:var(--sum-text);font-weight:700}
  tr.sum td:hover, tbody tr.sum:hover td{background:var(--sum)}
  tr.grand td{background:var(--total);color:var(--total-text);font-weight:700}
  tr.grand td.label{background:var(--total2);color:#fff}
  tr.grand:hover td{background:var(--total)}
  tbody tr:last-child td{border-bottom:none}

  /* Delete X button (no column) */
  tbody tr.row-data{position:relative}
  td.has-x{position:relative;padding-right:36px}
  .btn-x{
    position:absolute;top:50%;right:8px;transform:translateY(-50%);
    width:20px;height:20px;padding:0;border-radius:4px;
    background:transparent;border:none;color:#6b7280;
    font-size:0;line-height:0;
    display:inline-flex;align-items:center;justify-content:center;
    opacity:1;cursor:pointer;
    transition:color .15s ease, background .15s ease;
  }
  .btn-x::before{
    content:"";display:block;width:10px;height:10px;
    background:currentColor;
    -webkit-mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='3' stroke-linecap='round'><path d='M6 6l12 12M18 6L6 18'/></svg>") center/contain no-repeat;
            mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='3' stroke-linecap='round'><path d='M6 6l12 12M18 6L6 18'/></svg>") center/contain no-repeat;
  }
  .btn-x:hover{ color:#1f2937; background:#f3f4f6 }

  .range-tag{
    display:inline-flex;align-items:center;gap:6px;
    background:var(--primary-soft);color:var(--primary-strong);
    padding:6px 10px;border-radius:999px;font-size:13px;font-weight:600;
    margin-bottom:10px;
  }

  .empty{
    text-align:center;padding:40px 12px;color:var(--muted);
    background:#fafbff;border:1px dashed var(--line-strong);border-radius:10px;
  }
  .small{font-size:12px;color:var(--muted)}
  .footer-note{text-align:center}

  /* Modal */
  .modal-backdrop{
    position:fixed;inset:0;background:rgba(15,23,42,.45);
    display:none;align-items:center;justify-content:center;z-index:50;
    padding:16px;backdrop-filter:blur(2px);
    animation:fadeIn .15s ease;
  }
  .modal-backdrop.show{display:flex}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @keyframes popIn{from{opacity:0;transform:scale(.94) translateY(8px)}to{opacity:1;transform:scale(1) translateY(0)}}
  .modal{
    background:#fff;border-radius:16px;max-width:480px;width:100%;
    box-shadow:0 20px 60px rgba(15,23,42,.25);
    border:1px solid var(--line);
    overflow:hidden;display:flex;flex-direction:column;max-height:90vh;
    animation:popIn .18s ease;
  }
  .modal header{
    padding:16px 20px;border-bottom:1px solid var(--line);
    display:flex;align-items:center;justify-content:space-between;
  }
  .modal header h3{margin:0;font-size:16px}
  .modal .body{padding:16px 20px;overflow:auto}
  .modal footer{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}

  /* Confirm dialog */
  .confirm{
    background:#fff;border-radius:16px;max-width:420px;width:100%;
    box-shadow:0 20px 60px rgba(15,23,42,.25);
    border:1px solid var(--line);overflow:hidden;
    animation:popIn .18s ease;
  }
  .confirm .top{
    display:flex;gap:14px;align-items:flex-start;padding:22px 22px 6px;
  }
  .confirm .ic{
    flex:none;width:44px;height:44px;border-radius:50%;
    background:var(--danger-soft);color:var(--danger);
    display:flex;align-items:center;justify-content:center;
    font-size:22px;
  }
  .confirm .ic.warn{background:#fff7ed;color:#ea580c}
  .confirm h3{margin:0 0 4px;font-size:17px;font-weight:700}
  .confirm p{margin:0;color:var(--muted);font-size:13.5px;line-height:1.55}
  .confirm .detail{
    margin:14px 22px 0;padding:12px 14px;
    background:#f9fafb;border:1px solid var(--line);border-radius:10px;
    font-size:13px;line-height:1.7;
  }
  .confirm .detail .k{display:inline-block;min-width:64px;color:var(--muted)}
  .confirm .detail .v{font-weight:600;color:var(--text)}
  .confirm .actions{
    padding:18px 22px 20px;display:flex;justify-content:flex-end;gap:8px;
  }
  .confirm button.confirm-danger{
    background:var(--danger);color:#fff;border-color:var(--danger);
  }
  .confirm button.confirm-danger:hover{background:#dc2626;border-color:#dc2626}
  .plate-list{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none;max-height:340px;overflow:auto}
  .plate-list li{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:8px 10px 8px 14px;border:1px solid var(--line);border-radius:10px;
    background:#fff;transition:background .15s ease,border-color .15s ease;
  }
  .plate-list li:hover{background:#fafbff;border-color:var(--line-strong)}
  .plate-list code{font-family:inherit;font-weight:600;font-size:14px}
  .plate-list .pill{font-size:11px;background:#eef2ff;color:#4338ca;padding:2px 8px;border-radius:999px;margin-left:8px;font-weight:500}
  .plate-list .actions{display:flex;gap:4px;flex:none}

  /* icon button (round, ghost, with svg mask) */
  .icon-btn{
    width:32px;height:32px;padding:0;border-radius:8px;
    background:transparent;border:1px solid transparent;color:var(--muted);
    display:inline-flex;align-items:center;justify-content:center;
    cursor:pointer;transition:background .15s,color .15s,border-color .15s;
  }
  .icon-btn::before{
    content:"";display:block;width:16px;height:16px;background:currentColor;
  }
  .icon-btn.edit::before{
    -webkit-mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M12 20h9'/><path d='M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z'/></svg>") center/contain no-repeat;
            mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M12 20h9'/><path d='M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z'/></svg>") center/contain no-repeat;
  }
  .icon-btn.del::before{
    -webkit-mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='3 6 5 6 21 6'/><path d='M19 6l-2 14a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2L5 6'/><path d='M10 11v6'/><path d='M14 11v6'/><path d='M9 6V4a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2'/></svg>") center/contain no-repeat;
            mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='3 6 5 6 21 6'/><path d='M19 6l-2 14a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2L5 6'/><path d='M10 11v6'/><path d='M14 11v6'/><path d='M9 6V4a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2'/></svg>") center/contain no-repeat;
  }
  .icon-btn.save::before{
    -webkit-mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'><polyline points='20 6 9 17 4 12'/></svg>") center/contain no-repeat;
            mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'><polyline points='20 6 9 17 4 12'/></svg>") center/contain no-repeat;
  }
  .icon-btn.cancel::before{
    -webkit-mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='3' stroke-linecap='round'><path d='M6 6l12 12M18 6L6 18'/></svg>") center/contain no-repeat;
            mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='3' stroke-linecap='round'><path d='M6 6l12 12M18 6L6 18'/></svg>") center/contain no-repeat;
  }
  .icon-btn:hover{background:#f3f4f6;color:#1f2937}

  /* inline edit input ใน plate list */
  .plate-list .edit-input{
    flex:1;min-width:0;padding:7px 10px;font-size:14px;font-weight:600;
    border:1px solid var(--primary);border-radius:8px;
    box-shadow:0 0 0 3px rgba(37,99,235,.12);
  }

  /* ===== Responsive ===== */
  /* Tablet */
  @media (max-width: 900px){
    body{padding:24px 16px 40px}
    .wrap{gap:14px}
    .card{padding:16px}
    .field.grow{flex-basis:100%}
    .filter-bar .spacer{display:none}
  }

  /* Mobile */
  @media (max-width: 640px){
    body{padding:16px 12px 32px;font-size:14px}
    .wrap{gap:12px}
    .brand{font-size:15px;margin:0 0 -2px 2px}
    .card{padding:14px;border-radius:12px}
    .card h2{font-size:12px;margin-bottom:10px}

    /* Form: stack ทุก field เต็มความกว้าง */
    .row{gap:10px}
    .field{flex:1 1 100%;min-width:0}
    .field input,
    .field select,
    .field button{width:100% !important}
    .plate-input-wrap{min-width:0;width:100%}
    .plate-input-wrap input{flex:1;min-width:0}
    .plate-input-wrap button{flex:none;width:auto !important;padding:0 12px}

    /* Filter bar: stack vertical */
    .filter-bar{flex-direction:column;align-items:stretch}

    /* Table: ลด padding/font ให้พอดีจอเล็ก */
    th,td{padding:8px 6px;font-size:13px}
    .range-tag{font-size:12px;padding:5px 9px}
    td.has-x{padding-right:30px}
    .btn-x{width:22px;height:22px;right:4px}

    /* Modal */
    .modal,.confirm{max-width:100%;border-radius:14px}
    .confirm .top{padding:18px 18px 4px;gap:12px}
    .confirm .ic{width:38px;height:38px;font-size:20px}
    .confirm h3{font-size:16px}
    .confirm .detail{margin:12px 18px 0;padding:10px 12px;font-size:13px}
    .confirm .actions{padding:14px 18px 16px}

    /* Plate management list */
    .plate-list li{padding:8px 10px;font-size:13px}
    .plate-list .actions button{padding:6px 8px;font-size:12px}
  }

  /* จอเล็กมาก ปุ่มแถบ confirm จะวางซ้อนกัน */
  @media (max-width: 380px){
    .confirm .actions{flex-direction:column-reverse}
    .confirm .actions button{width:100%}
  }

  /* Install app button */
  #installBtn{
    position:fixed;right:16px;bottom:16px;z-index:80;
    padding:12px 18px;border-radius:999px;
    background:var(--primary);color:#fff;border:none;font-weight:600;
    box-shadow:0 8px 24px rgba(37,99,235,.35);
    display:none;align-items:center;gap:8px;cursor:pointer;
  }
  #installBtn.show{display:inline-flex}
  #installBtn:hover{background:var(--primary-strong)}
  /* ซ่อนเมื่อรันในโหมด standalone (ติดตั้งแล้ว) */
  @media (display-mode: standalone){
    #installBtn{display:none !important}
  }

  @media print{
    body{background:#fff;padding:0}
    .card.no-print, header.page, .footer-note, .modal-backdrop{display:none !important}
    .card{box-shadow:none;border:none;padding:0}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="page">
    <h1>ใบวางบิล</h1>
  </header>

  <div class="brand">ร้านเฮียต้อม ยางพารา</div>

  <div class="card no-print">
    <h2>เพิ่มข้อมูล</h2>
    <form id="form" class="row">
      <div class="field">
        <label for="date">วันที่</label>
        <input type="date" id="date" required>
      </div>
      <div class="field grow">
        <label for="plate">ทะเบียนรถ</label>
        <div class="plate-input-wrap">
          <input type="text" id="plate" list="plateList" placeholder="พิมพ์หรือเลือกจากรายการ" required autocomplete="off">
          <datalist id="plateList"></datalist>
          <button type="button" class="ghost icon" id="managePlates" title="จัดการรายการทะเบียน">⚙ จัดการ</button>
        </div>
      </div>
      <div class="field">
        <label for="qty">จำนวน</label>
        <input type="number" id="qty" value="1" min="1" required style="width:90px">
      </div>
      <div class="field">
        <label for="type">ชนิดรถ</label>
        <select id="type" required>
          <option value="พ่วง">พ่วง</option>
          <option value="สิบล้อ">สิบล้อ</option>
        </select>
      </div>
      <div class="field">
        <label for="price">จำนวนเงิน (บาท)</label>
        <input type="number" id="price" value="0" min="0" step="0.01" style="width:130px">
      </div>
      <div class="field"><button type="submit">+ เพิ่มข้อมูล</button></div>
      <div class="field"><button type="button" class="ghost" id="clearForm">ล้างฟอร์ม</button></div>
    </form>
  </div>

  <div class="card no-print">
    <div class="filter-bar">
      <div class="field">
        <label for="range">ช่วงเวลา</label>
        <select id="range">
          <option value="all">ทั้งหมด</option>
          <option value="day">รายวัน</option>
          <option value="week">รายสัปดาห์</option>
          <option value="month">รายเดือน</option>
        </select>
      </div>
      <div class="field" id="anchorWrap" style="display:none">
        <label for="anchor">อ้างอิงวันที่</label>
        <input type="date" id="anchor">
      </div>
      <div class="spacer"></div>
      <div class="field"><button type="button" id="exportBtn">⬇ Export Excel</button></div>
    </div>
  </div>

  <div class="card" id="tableCard">
    <div id="tableArea"></div>
  </div>

</div>

<!-- Install app button (PWA) -->
<button id="installBtn" type="button" title="ติดตั้งเป็นแอป">📲 ติดตั้งแอป</button>

<!-- Confirm modal -->
<div class="modal-backdrop" id="confirmModal" style="z-index:100">
  <div class="confirm" role="alertdialog" aria-modal="true">
    <div class="top">
      <div class="ic" id="confirmIcon">🗑</div>
      <div>
        <h3 id="confirmTitle">ยืนยันการลบ</h3>
        <p id="confirmMessage">คุณต้องการลบรายการนี้ใช่หรือไม่?</p>
      </div>
    </div>
    <div class="detail" id="confirmDetail" style="display:none"></div>
    <div class="actions">
      <button type="button" class="ghost" id="confirmCancel">ยกเลิก</button>
      <button type="button" class="confirm-danger" id="confirmOk">ลบ</button>
    </div>
  </div>
</div>

<!-- Plate management modal -->
<div class="modal-backdrop" id="plateModal">
  <div class="modal">
    <header>
      <h3>จัดการทะเบียนรถ</h3>
      <button type="button" class="ghost icon" id="closePlateModal">✕</button>
    </header>
    <div class="body">
      <form id="addPlateForm" class="row" style="margin-bottom:14px">
        <div class="field grow">
          <label for="newPlate">เพิ่มทะเบียนใหม่</label>
          <input type="text" id="newPlate" placeholder="เช่น 70-1234/5678" autocomplete="off">
        </div>
        <div class="field"><button type="submit">+ เพิ่ม</button></div>
      </form>
      <ul class="plate-list" id="plateListUl"></ul>
    </div>
    <footer>
      <button type="button" class="ghost" id="closePlateModal2">ปิด</button>
    </footer>
  </div>
</div>

<script>
// ===== PWA: register service worker + install prompt =====
if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("sw.js").catch(err=>console.warn("SW failed", err));
  });
}
let _deferredInstall = null;
window.addEventListener("beforeinstallprompt", e=>{
  e.preventDefault();
  _deferredInstall = e;
  const btn = document.getElementById("installBtn");
  if(btn) btn.classList.add("show");
});
window.addEventListener("appinstalled", ()=>{
  _deferredInstall = null;
  const btn = document.getElementById("installBtn");
  if(btn) btn.classList.remove("show");
});
document.addEventListener("DOMContentLoaded", ()=>{
  const btn = document.getElementById("installBtn");
  if(!btn) return;
  btn.addEventListener("click", async ()=>{
    if(!_deferredInstall) return;
    _deferredInstall.prompt();
    const { outcome } = await _deferredInstall.userChoice;
    if(outcome === "accepted") btn.classList.remove("show");
    _deferredInstall = null;
  });
});

const STORE_KEY = "billing-truck-records-v1";
const PLATE_KEY = "billing-truck-plates-v1";

// ทะเบียนเริ่มต้น (จากภาพตัวอย่าง)
const DEFAULT_PLATES = [
  "70-4198/4199",
  "70-3810/3811",
  "70-4368/4369",
  "83-9357/9358",
  "70-4471/4472",
  "70-3810"
];

const $ = sel => document.querySelector(sel);
const records = loadJson(STORE_KEY, []);
let plates = loadJson(PLATE_KEY, null);
if(!plates){ plates = [...DEFAULT_PLATES]; savePlates(); }

const form = $("#form");
const dateEl = $("#date");
const plateEl = $("#plate");
const qtyEl = $("#qty");
const typeEl = $("#type");
const priceEl = $("#price");
const rangeEl = $("#range");
const anchorEl = $("#anchor");
const anchorWrap = $("#anchorWrap");
const tableArea = $("#tableArea");
const plateListEl = $("#plateList");
const plateModal = $("#plateModal");
const plateListUl = $("#plateListUl");

(function initDates(){
  const today = new Date();
  const iso = today.toISOString().slice(0,10);
  dateEl.value = iso;
  anchorEl.value = iso;
})();

renderPlateOptions();
render();

// ===== Custom Confirm Dialog =====
const confirmModal = $("#confirmModal");
const confirmTitle = $("#confirmTitle");
const confirmMessage = $("#confirmMessage");
const confirmDetail = $("#confirmDetail");
const confirmIcon = $("#confirmIcon");
const confirmOk = $("#confirmOk");
const confirmCancel = $("#confirmCancel");
let _confirmResolve = null;

function showConfirm({title="ยืนยัน", message="", detail=null, okText="ลบ", cancelText="ยกเลิก", icon="🗑", danger=true} = {}){
  confirmTitle.textContent = title;
  confirmMessage.textContent = message;
  confirmIcon.textContent = icon;
  confirmIcon.className = "ic" + (danger ? "" : " warn");
  if(detail && Object.keys(detail).length){
    confirmDetail.style.display = "";
    confirmDetail.innerHTML = Object.entries(detail).map(([k,v])=>
      `<div><span class="k">${escapeHtml(k)}</span><span class="v">${escapeHtml(String(v))}</span></div>`
    ).join("");
  }else{
    confirmDetail.style.display = "none";
    confirmDetail.innerHTML = "";
  }
  confirmOk.textContent = okText;
  confirmCancel.textContent = cancelText;
  confirmOk.classList.toggle("confirm-danger", !!danger);
  confirmModal.classList.add("show");
  setTimeout(()=>confirmCancel.focus(),60);
  return new Promise(resolve=>{ _confirmResolve = resolve; });
}
function closeConfirm(result){
  confirmModal.classList.remove("show");
  if(_confirmResolve){ _confirmResolve(result); _confirmResolve = null; }
}
confirmOk.addEventListener("click",()=>closeConfirm(true));
confirmCancel.addEventListener("click",()=>closeConfirm(false));
confirmModal.addEventListener("click",e=>{ if(e.target===confirmModal) closeConfirm(false); });
document.addEventListener("keydown",e=>{
  if(!confirmModal.classList.contains("show")) return;
  if(e.key==="Escape") closeConfirm(false);
  else if(e.key==="Enter"){ e.preventDefault(); closeConfirm(true); }
});

form.addEventListener("submit", e => {
  e.preventDefault();
  const plate = plateEl.value.trim();
  const rec = {
    id: crypto.randomUUID(),
    date: dateEl.value,
    plate,
    qty: parseInt(qtyEl.value,10) || 1,
    type: typeEl.value,
    price: parseFloat(priceEl.value) || 0
  };
  if(!rec.date || !rec.plate) return;
  records.push(rec);
  saveRecords();
  // จำทะเบียนไว้ในรายการอัตโนมัติ
  if(plate && !plates.includes(plate)){
    plates.push(plate);
    savePlates();
    renderPlateOptions();
  }
  plateEl.value = "";
  qtyEl.value = 1;
  priceEl.value = 0;
  plateEl.focus();
  render();
});

$("#clearForm").addEventListener("click",()=>{
  plateEl.value=""; qtyEl.value=1; typeEl.value="พ่วง"; priceEl.value=0;
});

rangeEl.addEventListener("change",()=>{
  anchorWrap.style.display = rangeEl.value === "all" ? "none" : "";
  render();
});
anchorEl.addEventListener("change", render);

$("#exportBtn").addEventListener("click", exportExcel);

// Plate management
$("#managePlates").addEventListener("click", openPlateModal);
$("#closePlateModal").addEventListener("click", closePlateModal);
$("#closePlateModal2").addEventListener("click", closePlateModal);
plateModal.addEventListener("click",e=>{ if(e.target===plateModal) closePlateModal(); });
$("#addPlateForm").addEventListener("submit", e=>{
  e.preventDefault();
  const v = $("#newPlate").value.trim();
  if(!v) return;
  if(plates.includes(v)){ alert("มีทะเบียนนี้อยู่แล้ว"); return; }
  plates.push(v);
  savePlates();
  $("#newPlate").value = "";
  renderPlateOptions();
  renderPlateModalList();
});

function openPlateModal(){
  plateModal.classList.add("show");
  renderPlateModalList();
  setTimeout(()=>$("#newPlate").focus(),60);
}
function closePlateModal(){ plateModal.classList.remove("show"); }

function renderPlateOptions(){
  plateListEl.innerHTML = plates
    .slice()
    .sort((a,b)=>a.localeCompare(b))
    .map(p=>`<option value="${escapeAttr(p)}"></option>`).join("");
}

let editingPlate = null; // ทะเบียนที่กำลังแก้ไข

function renderPlateModalList(){
  if(!plates.length){
    plateListUl.innerHTML = `<div class="small" style="text-align:center;padding:14px">ยังไม่มีทะเบียน</div>`;
    return;
  }
  plateListUl.innerHTML = plates
    .slice()
    .sort((a,b)=>a.localeCompare(b))
    .map(p=>{
      const isDefault = DEFAULT_PLATES.includes(p);
      if(editingPlate === p){
        return `<li>
          <input type="text" class="edit-input" value="${escapeAttr(p)}" data-editing="${escapeAttr(p)}">
          <div class="actions">
            <button type="button" class="icon-btn save" data-save="${escapeAttr(p)}" title="บันทึก"></button>
            <button type="button" class="icon-btn cancel" data-cancel="1" title="ยกเลิก"></button>
          </div>
        </li>`;
      }
      return `<li>
        <div><code>${escapeHtml(p)}</code>${isDefault?'<span class="pill">เริ่มต้น</span>':''}</div>
        <div class="actions">
          <button type="button" class="icon-btn edit" data-edit="${escapeAttr(p)}" title="แก้ไข"></button>
          <button type="button" class="icon-btn del" data-rm="${escapeAttr(p)}" title="ลบ"></button>
        </div>
      </li>`;
    }).join("");

  // โฟกัส input และเลือกทั้งหมด
  if(editingPlate){
    const input = plateListUl.querySelector(".edit-input");
    if(input){ input.focus(); input.select(); }
  }

  // ลบ
  plateListUl.querySelectorAll("[data-rm]").forEach(b=>{
    b.addEventListener("click", async ()=>{
      const v = b.getAttribute("data-rm");
      const ok = await showConfirm({
        title:"ลบทะเบียนนี้?",
        message:"ทะเบียนนี้จะหายไปจากรายการตัวเลือก (ไม่กระทบข้อมูลที่บันทึกไว้)",
        detail:{ "ทะเบียน": v },
        okText:"ลบ"
      });
      if(!ok) return;
      plates = plates.filter(p=>p!==v);
      savePlates();
      renderPlateOptions();
      renderPlateModalList();
    });
  });

  // เริ่มแก้ไข
  plateListUl.querySelectorAll("[data-edit]").forEach(b=>{
    b.addEventListener("click",()=>{
      editingPlate = b.getAttribute("data-edit");
      renderPlateModalList();
    });
  });

  // ยกเลิก
  plateListUl.querySelectorAll("[data-cancel]").forEach(b=>{
    b.addEventListener("click",()=>{
      editingPlate = null;
      renderPlateModalList();
    });
  });

  // บันทึก
  plateListUl.querySelectorAll("[data-save]").forEach(b=>{
    b.addEventListener("click",()=>commitPlateEdit(b.getAttribute("data-save")));
  });

  // Enter = save, Esc = cancel
  const editInput = plateListUl.querySelector(".edit-input");
  if(editInput){
    editInput.addEventListener("keydown",e=>{
      if(e.key==="Enter"){ e.preventDefault(); commitPlateEdit(editInput.getAttribute("data-editing")); }
      else if(e.key==="Escape"){ editingPlate=null; renderPlateModalList(); }
    });
  }
}

function commitPlateEdit(oldValue){
  const input = plateListUl.querySelector(".edit-input");
  if(!input) return;
  const v = input.value.trim();
  if(!v){ editingPlate=null; renderPlateModalList(); return; }
  if(v === oldValue){ editingPlate=null; renderPlateModalList(); return; }
  if(plates.includes(v)){
    showConfirm({title:"มีทะเบียนนี้อยู่แล้ว", message:`ทะเบียน "${v}" มีอยู่ในรายการแล้ว`, okText:"เข้าใจแล้ว", cancelText:"", icon:"⚠", danger:false});
    return;
  }
  const idx = plates.indexOf(oldValue);
  if(idx>=0){ plates[idx] = v; savePlates(); }
  editingPlate = null;
  renderPlateOptions();
  renderPlateModalList();
}

function loadJson(key, fallback){
  try{
    const v = localStorage.getItem(key);
    if(v===null) return fallback;
    return JSON.parse(v);
  }catch{ return fallback; }
}
function saveRecords(){ localStorage.setItem(STORE_KEY, JSON.stringify(records)); }
function savePlates(){ localStorage.setItem(PLATE_KEY, JSON.stringify(plates)); }

function formatThaiDate(iso){
  if(!iso) return "";
  const [y,m,d] = iso.split("-");
  return `${d}/${m}/${y}`;
}

function getFilteredRange(){
  const mode = rangeEl.value;
  if(mode === "all") return { records: [...records], label: "ทั้งหมด" };
  const anchor = anchorEl.value || new Date().toISOString().slice(0,10);
  const a = new Date(anchor + "T00:00:00");
  let start, end, label;

  if(mode === "day"){
    start = new Date(a); end = new Date(a);
    label = `วันที่ ${formatThaiDate(anchor)}`;
  }else if(mode === "week"){
    const day = a.getDay();
    const diffToMon = (day === 0 ? -6 : 1 - day);
    start = new Date(a); start.setDate(a.getDate()+diffToMon);
    end = new Date(start); end.setDate(start.getDate()+6);
    label = `สัปดาห์ ${formatThaiDate(toISO(start))} - ${formatThaiDate(toISO(end))}`;
  }else if(mode === "month"){
    start = new Date(a.getFullYear(), a.getMonth(), 1);
    end = new Date(a.getFullYear(), a.getMonth()+1, 0);
    const monthNames = ["มกราคม","กุมภาพันธ์","มีนาคม","เมษายน","พฤษภาคม","มิถุนายน","กรกฎาคม","สิงหาคม","กันยายน","ตุลาคม","พฤศจิกายน","ธันวาคม"];
    label = `เดือน ${monthNames[a.getMonth()]} ${a.getFullYear()}`;
  }
  const sIso = toISO(start), eIso = toISO(end);
  const filtered = records.filter(r => r.date >= sIso && r.date <= eIso);
  return { records: filtered, label };
}

function toISO(d){
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,"0");
  const day = String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}

function groupByDate(list){
  const map = new Map();
  for(const r of list){
    if(!map.has(r.date)) map.set(r.date, []);
    map.get(r.date).push(r);
  }
  return [...map.entries()].sort((a,b)=>a[0].localeCompare(b[0]));
}

function render(){
  const {records: filtered, label} = getFilteredRange();
  const tag = label === "ทั้งหมด" ? "" : `<div class="range-tag">📅 ${label}</div>`;
  if(!filtered.length){
    tableArea.innerHTML = tag + `<div class="empty">ยังไม่มีข้อมูล — เพิ่มข้อมูลด้านบนเพื่อเริ่มต้น</div>`;
    return;
  }
  const groups = groupByDate(filtered);
  let html = tag + `<div class="table-wrap"><table id="dataTable">
    <thead><tr><th>วันที่</th><th>ทะเบียนรถ</th><th>จำนวน</th><th>ชนิดรถ</th><th>จำนวนเงิน</th></tr></thead><tbody>`;

  let totalPwang = 0, totalSibLor = 0, totalPrice = 0;

  for(const [date, rows] of groups){
    rows.forEach((r,i)=>{
      const p = +r.price || 0;
      html += `<tr class="row-data">
        <td>${i===0 ? formatThaiDate(date) : ""}</td>
        <td>${escapeHtml(r.plate)}</td>
        <td>${r.qty}</td>
        <td>${escapeHtml(r.type)}</td>
        <td class="has-x">${p ? formatMoney(p) : ""}<button class="btn-x" data-del="${r.id}" title="ลบรายการนี้" aria-label="ลบ">×</button></td>
      </tr>`;
    });
    const byType = {};
    rows.forEach(r=>{ byType[r.type] = (byType[r.type]||0)+r.qty; });
    const sumQty = rows.reduce((s,r)=>s+r.qty,0);
    const sumPrice = rows.reduce((s,r)=>s+(+r.price||0),0);
    const typeText = Object.keys(byType).join(" / ");
    html += `<tr class="sum"><td colspan="2">รวม</td><td>${sumQty}</td><td>${typeText}</td><td>${sumPrice ? formatMoney(sumPrice) : ""}</td></tr>`;
    rows.forEach(r=>{
      if(r.type==="พ่วง") totalPwang += r.qty;
      else if(r.type==="สิบล้อ") totalSibLor += r.qty;
      totalPrice += (+r.price||0);
    });
  }

  if(totalPwang){
    html += `<tr class="grand"><td class="label" rowspan="${(totalPwang && totalSibLor)?2:1}">ยอดรวมสุทธิ</td><td colspan="2"></td><td>${totalPwang}</td><td>พ่วง</td></tr>`;
  }
  if(totalSibLor){
    if(!totalPwang){
      html += `<tr class="grand"><td class="label">ยอดรวมสุทธิ</td><td colspan="2"></td><td>${totalSibLor}</td><td>สิบล้อ</td></tr>`;
    }else{
      html += `<tr class="grand"><td colspan="2"></td><td>${totalSibLor}</td><td>สิบล้อ</td></tr>`;
    }
  }
  html += `<tr class="grand"><td class="label" colspan="4">รวมเงินทั้งหมด</td><td>${formatMoney(totalPrice)} บาท</td></tr>`;

  html += `</tbody></table></div>`;
  tableArea.innerHTML = html;

  tableArea.querySelectorAll("[data-del]").forEach(btn=>{
    btn.addEventListener("click", async ()=>{
      const id = btn.getAttribute("data-del");
      const i = records.findIndex(r=>r.id===id);
      if(i<0) return;
      const r = records[i];
      const detail = {
        "วันที่": formatThaiDate(r.date),
        "ทะเบียน": r.plate,
        "จำนวน": r.qty,
        "ชนิดรถ": r.type
      };
      if(+r.price) detail["จำนวนเงิน"] = formatMoney(r.price) + " บาท";
      const ok = await showConfirm({
        title:"ลบรายการนี้?",
        message:"รายการนี้จะถูกลบออกจากตาราง",
        detail,
        okText:"ลบ"
      });
      if(!ok) return;
      records.splice(i,1);
      saveRecords();
      render();
    });
  });
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function escapeAttr(s){ return escapeHtml(s); }
function formatMoney(n){
  const v = Number(n)||0;
  return v.toLocaleString("th-TH", { minimumFractionDigits: Number.isInteger(v)?0:2, maximumFractionDigits: 2 });
}

function exportExcel(){
  const {records: filtered, label} = getFilteredRange();
  if(!filtered.length){ alert("ไม่มีข้อมูลให้ export"); return; }
  const groups = groupByDate(filtered);

  const aoa = [
    ["ใบวางบิล","","","",""],
    ["ร้านเฮียต้อม ยางพารา","","","",""],
    ["วันที่","ทะเบียนรถ","จำนวน","ชนิดรถ","จำนวนเงิน"]
  ];
  const styleRows = ["title","brand","header"];

  let totalPwang = 0, totalSibLor = 0, totalPrice = 0;

  for(const [date, rows] of groups){
    rows.forEach((r,i)=>{
      const p = +r.price || 0;
      aoa.push([ i===0 ? formatThaiDate(date) : "", r.plate, r.qty, r.type, p || "" ]);
      styleRows.push("data");
    });
    const byType = {};
    rows.forEach(r=>{ byType[r.type] = (byType[r.type]||0)+r.qty; });
    const sumQty = rows.reduce((s,r)=>s+r.qty,0);
    const sumPrice = rows.reduce((s,r)=>s+(+r.price||0),0);
    const typeText = Object.keys(byType).join(" / ");
    aoa.push(["รวม","", sumQty, typeText, sumPrice || ""]);
    styleRows.push("sum");
    rows.forEach(r=>{
      if(r.type==="พ่วง") totalPwang += r.qty;
      else if(r.type==="สิบล้อ") totalSibLor += r.qty;
      totalPrice += (+r.price||0);
    });
  }

  const summaryParts = [];
  if(totalPwang) summaryParts.push(`${totalPwang} พ่วง`);
  if(totalSibLor) summaryParts.push(`${totalSibLor} สิบล้อ`);
  if(summaryParts.length){
    aoa.push(["ยอดรวมสุทธิ","","","", summaryParts.join(" ")]);
    styleRows.push("grand");
  }
  aoa.push(["รวมเงินทั้งหมด","","","", totalPrice]);
  styleRows.push("grand");

  const ws = XLSX.utils.aoa_to_sheet(aoa);
  ws["!cols"] = [{wch:14},{wch:22},{wch:10},{wch:18},{wch:16}];

  const border = { top:{style:"thin",color:{rgb:"000000"}}, bottom:{style:"thin",color:{rgb:"000000"}}, left:{style:"thin",color:{rgb:"000000"}}, right:{style:"thin",color:{rgb:"000000"}} };
  const baseFont = { name:"Sarabun", sz:12 };

  const moneyFmt = '#,##0.00';
  const stylesByKind = {
    title:  { font:{...baseFont,bold:true,sz:20}, alignment:{horizontal:"center",vertical:"center"} },
    brand:  { font:{...baseFont,bold:true,sz:13}, alignment:{horizontal:"left",vertical:"center"} },
    header: { fill:{fgColor:{rgb:"FCD34D"}}, font:{...baseFont,bold:true}, alignment:{horizontal:"center",vertical:"center"}, border },
    data:   { font: baseFont, alignment:{horizontal:"center",vertical:"center"}, border },
    sum:    { fill:{fgColor:{rgb:"FFF7C2"}}, font:{...baseFont,bold:true}, alignment:{horizontal:"center",vertical:"center"}, border },
    grand:  { fill:{fgColor:{rgb:"CFFAFE"}}, font:{...baseFont,bold:true}, alignment:{horizontal:"center",vertical:"center"}, border }
  };

  for(let R=0; R<aoa.length; R++){
    const kind = styleRows[R];
    for(let C=0; C<5; C++){
      const addr = XLSX.utils.encode_cell({r:R,c:C});
      if(!ws[addr]) ws[addr] = {t:"s",v:""};
      let style = stylesByKind[kind];
      // money column: number format + right-align for data/sum/grand
      if(C===4 && (kind==="data"||kind==="sum"||kind==="grand") && typeof ws[addr].v === "number"){
        style = { ...style, numFmt: moneyFmt };
      }
      ws[addr].s = style;
    }
  }

  ws["!merges"] = ws["!merges"] || [];
  // merge ใบวางบิล (title) ทั้ง 5 คอลัมน์
  ws["!merges"].push({s:{r:0,c:0},e:{r:0,c:4}});
  // merge ร้านเฮียต้อม ยางพารา (brand) ทั้ง 5 คอลัมน์ ชิดซ้าย
  ws["!merges"].push({s:{r:1,c:0},e:{r:1,c:4}});
  // ความสูงแถวหัวเรื่อง
  ws["!rows"] = ws["!rows"] || [];
  ws["!rows"][0] = { hpt: 32 };
  ws["!rows"][1] = { hpt: 20 };
  for(let R=0; R<aoa.length; R++){
    if(styleRows[R] === "sum"){
      ws["!merges"].push({s:{r:R,c:0},e:{r:R,c:1}});
    }
  }
  // merge "ยอดรวมสุทธิ" และ "รวมเงินทั้งหมด" ครอบ 4 คอลัมน์แรก
  for(let R=0; R<aoa.length; R++){
    if(aoa[R][0] === "ยอดรวมสุทธิ" || aoa[R][0] === "รวมเงินทั้งหมด"){
      ws["!merges"].push({s:{r:R,c:0},e:{r:R,c:3}});
    }
  }

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "ใบวางบิล");
  const today = new Date().toISOString().slice(0,10);
  const safeLabel = label.replace(/[\\/:*?"<>|]/g,"-");
  XLSX.writeFile(wb, `ใบวางบิล_${safeLabel}_${today}.xlsx`);
}
